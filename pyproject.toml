[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moukey"
dynamic = ["version"]
description = "Use o mesmo mouse e teclado em dois computadores, sem configurar nada"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "zeroconf>=0.130",
    "pynput>=1.7",
    "pyperclip>=1.8",
    "pywebview>=5",
    "pystray>=0.19",
    "pillow>=10",
    # the mac backend talks to quartz and appkit directly
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
moukey = "moukey.__main__:main"

# opens the window without a black terminal behind it
[project.gui-scripts]
moukey-janela = "moukey.webapp:main"

[tool.hatch.version]
path = "moukey/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
