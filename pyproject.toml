[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ponte"
dynamic = ["version"]
description = "Use o mesmo mouse e teclado em dois computadores, sem configurar nada"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "zeroconf>=0.130", "pynput>=1.7", "pyperclip>=1.8"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
ponte = "ponte.__main__:main"

# opens the window without a black terminal behind it
[project.gui-scripts]
ponte-janela = "ponte.gui:main"

[tool.hatch.version]
path = "ponte/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
