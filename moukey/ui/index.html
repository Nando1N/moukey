<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>MouKey</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand"><img src="img/logo.png" alt="MouKey" /></div>
        <nav class="nav">
          <button data-page="devices" class="on">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
            Dispositivos
          </button>
          <button data-page="screens">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="9" height="7" rx="1.5"/><rect x="13" y="6" width="9" height="7" rx="1.5"/><path d="M6.5 17h11"/></svg>
            Telas
          </button>
        </nav>
        <div class="side-foot" id="foot"><span class="dot pulse"></span>Iniciando...</div>
      </aside>

      <main class="main">
        <section class="page" id="page-devices">
          <h1>Dispositivos</h1>
          <p class="sub">Computadores encontrados na sua rede. Clique em Conectar no computador que tem o mouse e o teclado que você quer usar.</p>
          <div id="notices"></div>
          <div class="list" id="me"></div>
          <h2>Na rede</h2>
          <div class="list" id="peers"></div>
        </section>

        <section class="page hidden" id="page-screens">
          <h1>Telas</h1>
          <p class="sub">Arraste o outro computador para onde ele fica na sua mesa. O mouse passa pela borda que estiver encostada.</p>
          <div class="tabs" id="screen-tabs"></div>
          <div id="screens-body"></div>
        </section>
      </main>
    </div>

    <div class="overlay hidden" id="pairing"></div>

    <script src="app.js"></script>
  </body>
</html>
