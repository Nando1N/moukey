# runs the tests and the linter on windows and linux for every pull request.
# it only tests, nothing gets built or published from here
name: testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # the oldest version we support, so nothing newer sneaks in by accident
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  # the linux backend talks to a real x server, xvfb gives us one without a monitor
  linux-x11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pip install -e ".[dev]"
      - run: xvfb-run -a -s "-screen 0 1920x1080x24 +extension RECORD +extension XTEST" pytest -q tests/test_linux_x11.py
