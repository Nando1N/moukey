# builds MouKey.exe on github from the public code when a version tag is pushed (v0.1.0, v0.2.0...)
# the exe never comes from my pc, so anyone can check it was built from what's in the repo.
# two jobs: the one that builds can't write to the repo, the one that writes doesn't run
# any third party package
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # the tag goes in as a variable, never pasted into a script
  TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # sign the build attestation
      attestations: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-build.txt
      - run: pip install --no-deps -e .

      # don't publish something that fails the tests
      - run: ruff check .
      - run: pytest -q

      # tag and code have to agree, or the "versions differ" warning gets confusing
      - name: confere a versao
        run: |
          $v = python -c "import moukey; print(moukey.__version__)"
          if ("v$v" -ne $env:TAG) { throw "tag $env:TAG mas o codigo diz $v" }

      - run: ./scripts/build-exe.ps1

      - name: hash
        run: |
          $h = (Get-FileHash dist/MouKey.exe -Algorithm SHA256).Hash.ToLower()
          "$h  MouKey.exe" | Out-File dist/MouKey.exe.sha256 -Encoding ascii
          Copy-Item .github/release-notas.md dist/notas.md

      # the installer: start menu, desktop shortcut, apps list, open with windows
      - name: instalador
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$($env:TAG.TrimStart('v'))" "/DExeDir=..\dist" installer\moukey.iss
          if ($LASTEXITCODE -ne 0) { throw "inno setup falhou" }
          $h = (Get-FileHash dist/MouKey-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  MouKey-Setup.exe" | Out-File dist/MouKey-Setup.exe.sha256 -Encoding ascii

      # proof on github that this exe came from this workflow and this commit
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/MouKey.exe
            dist/MouKey-Setup.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exe
          path: |
            dist/MouKey.exe
            dist/MouKey.exe.sha256
            dist/MouKey-Setup.exe
            dist/MouKey-Setup.exe.sha256
            dist/notas.md

  # experimental: nobody tested it on a real mac yet. apple silicon only for now
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # TODO: pinned versions for the mac too, like requirements-build.txt
      - run: pip install -e ".[dev]" pyinstaller==6.22.3
      - run: pytest -q

      - name: monta o app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed \
            --name MouKey \
            --icon "$PWD/assets/icone/moukey-512.png" \
            --osx-bundle-identifier io.github.nando1n.moukey \
            --paths . \
            --specpath build \
            --add-data "$PWD/moukey/ui:moukey/ui" \
            --collect-submodules zeroconf \
            --collect-all webview \
            moukey/webapp.py

      # macos 15 blocks finding other computers on the network unless the app says why.
      # changing Info.plist breaks the signature, so it's signed again (ad hoc) after
      - name: rede local no Info.plist
        run: |
          plist=dist/MouKey.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'O MouKey procura e conecta nos seus outros computadores da rede local.'" "$plist"
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" -c "Add :NSBonjourServices:0 string _moukey._tcp" "$plist"
          codesign --force --deep --sign - dist/MouKey.app
          codesign --verify --deep dist/MouKey.app

      # the usual mac install: open the dmg, drag MouKey onto Applications
      - name: dmg e hash
        run: |
          mkdir -p dmg
          cp -R dist/MouKey.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname MouKey -srcfolder dmg -ov -format UDZO dist/MouKey-macos.dmg
          cd dist
          shasum -a 256 MouKey-macos.dmg > MouKey-macos.dmg.sha256

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/MouKey-macos.dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac
          path: |
            dist/MouKey-macos.dmg
            dist/MouKey-macos.dmg.sha256

  publish:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: exe
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mac
      - name: textos do release
        run: |
          win=$(cut -c1-64 MouKey.exe.sha256)
          setup=$(cut -c1-64 MouKey-Setup.exe.sha256)
          mac=$(cut -c1-64 MouKey-macos.dmg.sha256)
          sed -i "s/{{SHA256}}/$win/; s/{{SHA256_SETUP}}/$setup/; s/{{SHA256_MAC}}/$mac/; s/{{VERSAO}}/$TAG/" notas.md
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" MouKey-Setup.exe MouKey-Setup.exe.sha256 MouKey.exe MouKey.exe.sha256 MouKey-macos.dmg MouKey-macos.dmg.sha256 --repo "$GITHUB_REPOSITORY" --title "MouKey $TAG" --notes-file notas.md
      # only the newest exe stays up, old ones may have bugs that were already fixed.
      # the tags stay, so the code of every version is still there
      - name: apaga os releases antigos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
            grep -vx "$TAG" | while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes
            done
